name: Test and deploy
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    # Ships chromium, firefox and webkit plus their system libraries, already
    # matched to the @playwright/test version. Keep the tag in step with the
    # dependency in package.json when bumping Playwright.
    container: mcr.microsoft.com/playwright:v1.62.0-noble

    env:
      NODE_OPTIONS: --max-old-space-size=4096
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI: true
      WIREIT_LOGGER: 'simple'
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      # v2 of this action is required: GitHub retired the v1 Actions cache
      # service, which made wireit fail with "GitHub Cache check HTTP 400 error".
      # wireit >= 0.14.12 speaks the v2 cache backend.
      - uses: google/wireit@setup-github-actions-caching/v2

      # The container already provides the browsers at $PLAYWRIGHT_BROWSERS_PATH,
      # so `playwright install` inside `setup` is a no-op.
      - name: Install
        run: npm run setup

      - name: Types and linter check
        run: npm run test:lint

      - name: Unit tests
        run: npm run test:unit -- --coverage --coverageReporters="lcov"

      - name: Run codacy-coverage-reporter
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        continue-on-error: true
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage/lcov.info

      - name: E2E tests builded version
        run: npm run test:e2e

      - name: E2E tests dev version
        run: npm run test:e2e:dev

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

      - name: Storybook tests
        run: npm run test:storybook-ci

  deploy-storybook:
    needs: build-test
    runs-on: ubuntu-24.04
    if: github.ref_name == 'master'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install
        run: npm run setup
      - name: Build storybook
        run: npm run build-storybook
      - name: Deploy storybook
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref_name == 'master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./storybook-static

