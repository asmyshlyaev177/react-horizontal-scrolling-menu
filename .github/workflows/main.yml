name: Test and deploy
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Kept as an escape hatch — e.g. to retry a release whose publish step failed
  # after the tag was already pushed.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only ever cancel superseded PR builds. A master run may be publishing, and
  # cancelling it between `git push` and `npm publish` would leave a tag with no
  # package behind it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-24.04
    # Ships chromium, firefox and webkit plus their system libraries, already
    # matched to the @playwright/test version. Keep the tag in step with the
    # dependency in package.json when bumping Playwright.
    container: mcr.microsoft.com/playwright:v1.62.0-noble

    env:
      NODE_OPTIONS: --max-old-space-size=4096
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI: true
      WIREIT_LOGGER: 'simple'
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      # The repo is checked out by the runner but git runs as root inside the
      # container, so every `git rev-parse` fails with "dubious ownership" —
      # which is what breaks Storybook's change detection.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # NOTE: google/wireit@setup-github-actions-caching/v2 used to be here. Its
      # cache token mediator is not reachable from inside a job container, so
      # every wireit invocation failed with ECONNREFUSED, printed an "Internal
      # error! Please file a bug" block, and disabled caching anyway — 8 failures
      # and 0 cache hits per run. Without WIREIT_CACHE set, wireit uses its local
      # .wireit cache, which is what the "Already fresh" results come from.

      # The container already provides the browsers at $PLAYWRIGHT_BROWSERS_PATH,
      # so `playwright install` inside `setup` is a no-op.
      - name: Install
        run: npm run setup

      - name: Types and linter check
        run: npm run test:lint

      - name: Unit tests
        run: npm run test:unit -- --coverage --coverageReporters="lcov"

      - name: Run codacy-coverage-reporter
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        continue-on-error: true
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage/lcov.info

      - name: E2E tests builded version
        run: npm run test:e2e

      - name: E2E tests dev version
        run: npm run test:e2e:dev

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

      # Firefox refuses to start as root when $HOME belongs to someone else, and
      # the container's HOME (/github/home) is owned by pwuser. This is the
      # workaround Playwright's own launch error prescribes. Only needed here:
      # the Playwright e2e specs run chromium, which has no such check.
      - name: Storybook tests
        env:
          HOME: /root
        run: npm run test:storybook-ci

  deploy-storybook:
    needs: build-test
    runs-on: ubuntu-24.04
    if: github.ref_name == 'master'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install
        run: npm run setup
      - name: Build storybook
        run: npm run build-storybook
      - name: Deploy storybook
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref_name == 'master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./storybook-static

  # Bumps the version, writes the changelog, tags, pushes and publishes. Runs on
  # every master push once build-test is green — the suite is not repeated here.
  # The release commit itself cannot retrigger this: it is pushed with
  # GITHUB_TOKEN, which never starts a workflow run, and is marked [skip ci].
  release:
    needs: build-test
    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref_name == 'master'
    runs-on: ubuntu-24.04
    # Same image as build-test so the browsers `prepack` pulls in via
    # setup-tooling are already present and `playwright install` is a no-op.
    container: mcr.microsoft.com/playwright:v1.62.0-noble

    permissions:
      contents: write # push the release commit and its tag
      id-token: write # exchange an OIDC token for npm's short-lived credential

    env:
      # The release commit is made by a script, and `git commit --no-verify`
      # does NOT skip prepare-commit-msg — which runs commitizen and needs a
      # terminal the runner does not have. Husky's wrapper honours HUSKY=0.
      HUSKY: 0

    steps:
      - uses: actions/checkout@v7
        with:
          # commit-and-tag-version derives the bump and the changelog from every
          # commit and tag since the last release, so a shallow clone gives the
          # wrong version and an empty changelog.
          fetch-depth: 0

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Left to itself commit-and-tag-version bumps a patch for *any* commit, so
      # a docs- or chore-only merge would publish a new version whose changelog
      # entry is empty. Only release when something user-visible landed.
      - name: Is there anything to release?
        id: check
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          echo "Last tag: ${last:-<none>}"
          if git log ${last:+"$last"..HEAD} --format='%s%n%b' \
             | grep -qE '^(feat|fix|perf)(\(.+\))?!?:|^BREAKING[ -]CHANGE:'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No feat/fix/perf commits since ${last:-the first commit} — skipping the release."
          fi

      # No `cache: npm` here: npm advises against restoring a package manager
      # cache in a release build, so the published tarball is built from what
      # the lockfile actually resolves to today.
      - uses: actions/setup-node@v7
        if: steps.check.outputs.release == 'true'
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1. Node 24 has shipped a new enough
      # npm since 24.4, but assert it rather than discover it after the tag has
      # already been pushed.
      - name: Check npm supports trusted publishing
        if: steps.check.outputs.release == 'true'
        run: |
          npx --yes semver -r '>=11.5.1' "$(npm -v)" >/dev/null \
            || { echo "npm $(npm -v) is too old for trusted publishing (need >= 11.5.1)" >&2; exit 1; }

      - name: Install
        if: steps.check.outputs.release == 'true'
        run: npm ci

      - name: Identify the committer
        if: steps.check.outputs.release == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # Called directly rather than through `npm run release`, whose wireit
      # graph would re-run the entire suite that build-test just finished.
      - name: Version, changelog and tag
        if: steps.check.outputs.release == 'true'
        run: >
          npx commit-and-tag-version --no-verify
          --releaseCommitMessageFormat 'chore(release): {{currentTag}} [skip ci]'

      # Publish BEFORE pushing. npm publish is by far the likeliest step to
      # fail — auth, registry config, a rejected tarball — and when it ran after
      # the push it left a tag on GitHub with no package behind it, which no
      # re-run can heal because the next run bumps to the following version.
      # This way a failed publish leaves the commit and tag local to the runner
      # and the run is simply a clean retry. The inverse risk, a push failing
      # after a successful publish, is far rarer and leaves the package correct.
      #
      # Authenticates through the trusted publisher linked on npmjs.com — no
      # NPM_TOKEN, and provenance is attested automatically, so `--provenance`
      # is not passed. `prepack` rebuilds dist here, so the tarball always
      # matches the tag that was just created.
      - name: Publish to npm
        if: steps.check.outputs.release == 'true'
        run: npm publish --access public

      - name: Push the release commit and tag
        if: steps.check.outputs.release == 'true'
        run: git push --follow-tags origin HEAD:master
