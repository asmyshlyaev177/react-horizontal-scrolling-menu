name: Test and deploy
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Kept as an escape hatch — e.g. to retry a release whose publish step failed
  # after the tag was already pushed.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only ever cancel superseded PR builds. A master run may be publishing, and
  # cancelling it between `git push` and `npm publish` would leave a tag with no
  # package behind it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    # Deliberately NOT inside the Playwright container: the tanstack example
    # serves through workerd (Cloudflare's runtime), and workerd accepts
    # connections but never answers them inside docker job containers —
    # cloudflare/workers-sdk#6280, reproduced with the official Playwright
    # image — which left `wait-on` polling port 3004 forever. On the plain
    # VM workerd is fine; `pnpm run setup` downloads the browsers and the
    # install-deps step below provides their system libraries.
    runs-on: ubuntu-24.04
    # A hung step (e.g. wait-on polling a server that never answers) otherwise
    # burns the full 6-hour default before anyone notices.
    timeout-minutes: 30

    env:
      NODE_OPTIONS: --max-old-space-size=4096
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI: true
      WIREIT_LOGGER: 'simple'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Before setup-node so `cache: 'pnpm'` finds the store. Version comes
      # from the root package.json `packageManager`.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      # NOTE: google/wireit@setup-github-actions-caching/v2 used to be here.
      # Its cache token mediator was unreachable from the job container this
      # job used to run in, so every wireit invocation failed with
      # ECONNREFUSED and disabled caching anyway. Without WIREIT_CACHE set,
      # wireit uses its local .wireit cache, which is what the "Already
      # fresh" results come from.

      # `setup` also downloads the browsers matching @playwright/test.
      - name: Install
        run: pnpm run setup

      # The e2e specs run chromium only; firefox and webkit live in the
      # storybook-test job's container.
      - name: Install browser system dependencies
        run: npx playwright install-deps chromium

      - name: Types and linter check
        run: pnpm run test:lint

      - name: Unit tests
        run: pnpm run test:unit -- --coverage --coverageReporters="lcov"

      - name: Run codacy-coverage-reporter
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        continue-on-error: true
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage/lcov.info

      # run:e2e's wait-on carries `-t 300000 --httpTimeout 10000` because its
      # defaults are no overall timeout and no per-request timeout: one HEAD
      # request landing in vite preview's bound-but-workerd-still-booting
      # window used to hang the resource's poll loop — and this step — forever.
      - name: E2E tests builded version
        run: pnpm run test:e2e

      - name: E2E tests dev version
        run: pnpm run test:e2e:dev

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  # The three-browser matrix lives in the Playwright container: it ships
  # chromium, firefox AND webkit with their system libraries already matched
  # to the @playwright/test version (webkit's apt footprint on the VM is
  # large), and it runs in parallel with build-test. Storybook tests never
  # touch workerd, so unlike build-test's e2e they are safe inside a job
  # container. Keep the image tag in step with @playwright/test when
  # bumping Playwright.
  storybook-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: mcr.microsoft.com/playwright:v1.62.0-noble

    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CI: true
      WIREIT_LOGGER: 'simple'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Before setup-node so `cache: 'pnpm'` finds the store. Version comes
      # from the root package.json `packageManager`.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      # The repo is checked out by the runner but git runs as root inside the
      # container, so every `git rev-parse` fails with "dubious ownership" —
      # which is what breaks Storybook's change detection.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The container already provides the browsers at
      # $PLAYWRIGHT_BROWSERS_PATH, so `playwright install` inside `setup`
      # is a no-op.
      - name: Install
        run: pnpm run setup

      # Firefox refuses to start as root when $HOME belongs to someone else,
      # and the container's HOME (/github/home) is owned by pwuser. This is
      # the workaround Playwright's own launch error prescribes.
      - name: Storybook tests
        env:
          HOME: /root
        run: pnpm run test:storybook-ci

  # The landing page in website/ — TanStack Start SSR'd on Cloudflare
  # Workers. Built on every push/PR so a library or website change that
  # breaks it fails fast; deployed only from master, and only when the
  # CLOUDFLARE_API_TOKEN secret exists (create one with "Workers Scripts:
  # Edit" permission and add it via repo settings or `gh secret set`).
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # website/ is a workspace member on `workspace:*`, so it builds against
      # this checkout. One root install covers every member.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install
        run: pnpm install --frozen-lockfile
      # The site imports dist/, so it must exist before website/ is built.
      - name: Build the library
        run: pnpm build
      - name: Typecheck
        run: pnpm run typecheck
        working-directory: website
      # `pnpm test` builds, then runs the Playwright suite against `vite
      # preview` — the built site in workerd. No browser is downloaded on
      # purpose: every assertion in website/e2e is HTTP-level (status,
      # headers, body) and runs on Playwright's `request` fixture, so
      # `playwright install` is not needed here. A test that touches `page`
      # would change that.
      #
      # workerd is why this job has no `container:` — see the note on
      # build-test above; inside a job container it accepts connections and
      # never answers them, which would hang the webServer wait.
      - name: Build and smoke test
        run: pnpm test
        working-directory: website
      # The one suite here that drives a real page, hence its own config, its
      # own step, and the browser download the smoke suite avoids. No job
      # container for the same reason build-test has none: `vite preview` is
      # workerd, which hangs inside one. `--only-shell` because with no
      # `channel` set a headless launch resolves to chromium-headless-shell —
      # drop it if a test ever needs `headless: false`.
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium
        working-directory: website
      - name: Accessibility audit
        run: pnpm run test:a11y
        working-directory: website
      # The whole point of the page is that the demos are server-rendered;
      # a prerender that silently degrades to an empty shell must fail CI.
      - name: Assert demos are prerendered
        run: |
          grep -aq 'data-key="item-1"' website/dist/client/index.html \
            || { echo "Prerendered HTML lost the server-rendered demos" >&2; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: website-playwright-report
          path: |
            website/playwright-report
            website/test-results

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref_name == 'master'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set — skipping deploy (the site can still be deployed locally with 'pnpm deploy')."
            exit 0
          fi
          pnpm exec wrangler deploy
        working-directory: website

  deploy-storybook:
    needs: [build-test, storybook-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.ref_name == 'master'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Before setup-node so `cache: 'pnpm'` finds the store. Version comes
      # from the root package.json `packageManager`.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install
        run: pnpm run setup
      - name: Build storybook
        run: pnpm run build-storybook
      - name: Deploy storybook
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        if: github.ref_name == 'master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./storybook-static

  # Bumps the version, writes the changelog, tags, pushes and publishes. Runs on
  # every master push once build-test is green — the suite is not repeated here.
  # The release commit itself cannot retrigger this: it is pushed with
  # GITHUB_TOKEN, which never starts a workflow run, and is marked [skip ci].
  release:
    needs: [build-test, storybook-test]
    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref_name == 'master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The Playwright image ships the browsers `prepack` pulls in via
    # setup-tooling, so `playwright install` is a no-op. Unlike build-test
    # this job never talks to workerd, so the job container is safe here.
    # Keep the tag in step with @playwright/test when bumping Playwright.
    container: mcr.microsoft.com/playwright:v1.62.0-noble

    permissions:
      contents: write # push the release commit and its tag
      id-token: write # exchange an OIDC token for npm's short-lived credential

    env:
      # The release commit is made by a script, and `git commit --no-verify`
      # does NOT skip prepare-commit-msg — which runs commitizen and needs a
      # terminal the runner does not have. Husky's wrapper honours HUSKY=0.
      HUSKY: 0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # commit-and-tag-version derives the bump and the changelog from every
          # commit and tag since the last release, so a shallow clone gives the
          # wrong version and an empty changelog.
          fetch-depth: 0

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Left to itself commit-and-tag-version bumps a patch for *any* commit, so
      # a docs- or chore-only merge would publish a new version whose changelog
      # entry is empty. Only release when something user-visible landed.
      - name: Is there anything to release?
        id: check
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          echo "Last tag: ${last:-<none>}"
          if git log ${last:+"$last"..HEAD} --format='%s%n%b' \
             | grep -qE '^(feat|fix|perf)(\(.+\))?!?:|^BREAKING[ -]CHANGE:'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No feat/fix/perf commits since ${last:-the first commit} — skipping the release."
          fi

      # No `cache: npm` here: npm advises against restoring a package manager
      # cache in a release build, so the published tarball is built from what
      # the lockfile actually resolves to today.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: steps.check.outputs.release == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.check.outputs.release == 'true'
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1. Node 24 has shipped a new enough
      # npm since 24.4, but assert it rather than discover it after the tag has
      # already been pushed.
      - name: Check npm supports trusted publishing
        if: steps.check.outputs.release == 'true'
        run: |
          npx --yes semver -r '>=11.5.1' "$(npm -v)" >/dev/null \
            || { echo "npm $(npm -v) is too old for trusted publishing (need >= 11.5.1)" >&2; exit 1; }

      - name: Install
        if: steps.check.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Identify the committer
        if: steps.check.outputs.release == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # Called directly rather than through `pnpm run release`, whose wireit
      # graph would re-run the entire suite that build-test just finished.
      - name: Version, changelog and tag
        if: steps.check.outputs.release == 'true'
        run: >
          npx commit-and-tag-version --no-verify
          --releaseCommitMessageFormat 'chore(release): {{currentTag}} [skip ci]'

      # Publish BEFORE pushing. npm publish is by far the likeliest step to
      # fail — auth, registry config, a rejected tarball — and when it ran after
      # the push it left a tag on GitHub with no package behind it, which no
      # re-run can heal because the next run bumps to the following version.
      # This way a failed publish leaves the commit and tag local to the runner
      # and the run is simply a clean retry. The inverse risk, a push failing
      # after a successful publish, is far rarer and leaves the package correct.
      #
      # Authenticates through the trusted publisher linked on npmjs.com — no
      # NPM_TOKEN, and provenance is attested automatically, so `--provenance`
      # is not passed. `prepack` rebuilds dist here, so the tarball always
      # matches the tag that was just created.
      - name: Publish to npm
        if: steps.check.outputs.release == 'true'
        run: npm publish --access public

      - name: Push the release commit and tag
        if: steps.check.outputs.release == 'true'
        run: git push --follow-tags origin HEAD:master
