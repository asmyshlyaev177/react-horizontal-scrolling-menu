skills:
  - name: 'menu setup'
    slug: 'menu-setup'
    domain: 'building-the-menu'
    description: 'Build a working horizontal menu: install, import styles.css, items with unique itemId, arrows via VisibilityContext, CSS customization'
    type: 'lifecycle'
    covers:
      - 'ScrollMenu'
      - 'VisibilityContext'
      - 'publicApiType'
      - 'itemId contract'
      - 'styles.css import'
      - 'LeftArrow/RightArrow/Header/Footer slots'
      - 'useLeftArrowVisible/useRightArrowVisible'
      - 'itemClassName/scrollContainerClassName/wrapperClassName'
      - 'CSS: item spacing, item width, hiding scrollbar'
    tasks:
      - 'set up a category row / tab strip / chip filter'
      - 'add arrow buttons that disable at the edges'
      - 'style items and the space between them'
    failure_modes:
      - mistake: 'styles.css import omitted, menu stacks vertically'
        mechanism: 'The JS bundle never injects CSS; without the stylesheet the flex scroll container does not exist and items render as a vertical block.'
        wrong_pattern: |
          import { ScrollMenu } from 'react-horizontal-scrolling-menu';
          // no CSS import — items stack vertically, nothing scrolls
        correct_pattern: |
          import { ScrollMenu } from 'react-horizontal-scrolling-menu';
          import 'react-horizontal-scrolling-menu/dist/styles.css';
        source: 'README.md Quick start; CHANGELOG v4.0.0/v4.0.1 (#231)'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'itemId missing or miscased on direct children'
        mechanism: 'Every direct child needs a unique itemId prop (React key is the fallback); without it items register under an empty id, colliding in the ItemsMap, and arrows/visibility silently break. There is no runtime warning.'
        wrong_pattern: |
          <ScrollMenu LeftArrow={LeftArrow} RightArrow={RightArrow}>
            {items.map((it) => <Card itemID={it.id} key={it.id} />)}
          </ScrollMenu>
        correct_pattern: |
          <ScrollMenu LeftArrow={LeftArrow} RightArrow={RightArrow}>
            {items.map((it) => <Card itemId={it.id} key={it.id} />)}
          </ScrollMenu>
        source: 'https://github.com/asmyshlyaev177/react-horizontal-scrolling-menu/issues/205 (#185, #187, #194, #207); src/helpers.tsx getItemId'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'renaming itemId to itemID to silence the React DOM warning'
        mechanism: 'When an item spreads props onto a DOM element React warns "Invalid DOM property itemId. Did you mean itemID?" — the warning is expected and harmless; renaming the prop breaks tracking entirely.'
        wrong_pattern: |
          // "fixing" the console warning:
          <Card itemID={id} key={id} />
        correct_pattern: |
          // keep itemId; don't spread it onto the DOM node inside Card
          function Card({ itemId, ...rest }: { itemId: string; title: string }) {
            return <div>{rest.title}</div>;
          }
        source: 'https://github.com/asmyshlyaev177/react-horizontal-scrolling-menu/issues/196'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'duplicate itemId values silently collide'
        mechanism: 'ItemsMap extends Map keyed by String(itemId): duplicates overwrite each other (last wins) with zero warnings; visibility and scrollToItem then target the wrong element. Maintainer wishes a console.warn existed — agents must self-check uniqueness.'
        wrong_pattern: |
          {products.map((p) => <Card itemId={p.category} key={p.sku} />)}
        correct_pattern: |
          {products.map((p) => <Card itemId={p.sku} key={p.sku} />)}
        source: 'src/ItemsMap/ItemsMap.ts; maintainer interview'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'expecting arrow components to receive props'
        mechanism: 'LeftArrow/RightArrow/Header/Footer are rendered as <Elem /> with no props (getElementOrConstructor); arrows must read state from React.useContext(VisibilityContext).'
        wrong_pattern: |
          <ScrollMenu LeftArrow={(api) => <Arrow onClick={api.scrollPrev} />}>
        correct_pattern: |
          function LeftArrow() {
            const api = React.useContext<publicApiType>(VisibilityContext);
            const disabled = api.useLeftArrowVisible();
            return <button disabled={disabled} onClick={() => api.scrollPrev()}>←</button>;
          }
        source: 'src/helpers.tsx:88-99 getElementOrConstructor'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'items without fixed width, or percent widths'
        mechanism: 'The menu measures nothing — item width comes from your CSS; percent widths break the flex layout and oversized items are never counted visible.'
        wrong_pattern: |
          .card { width: 50%; }
        correct_pattern: |
          .card { width: 160px; }
        source: 'README.md Quick start; https://github.com/asmyshlyaev177/react-horizontal-scrolling-menu/issues/288'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'looking for a separator or gap prop for item spacing'
        mechanism: 'Separator elements were removed in v7; spacing is plain CSS — gap on the scroll container (scrollContainerClassName) or margin on your item component. Maintainer names CSS customization as the most-missed knowledge.'
        wrong_pattern: |
          <ScrollMenu separatorClassName="gap" itemsGap={8}>
        correct_pattern: |
          <ScrollMenu scrollContainerClassName="menu-row">
          /* CSS */ .menu-row { gap: 8px; }
        source: 'maintainer interview; CHANGELOG v7.0.0 (#274)'
        priority: 'MEDIUM'
        status: 'active'
        skills: ['menu-setup', 'menu-migration']

  - name: 'visibility tracking'
    slug: 'menu-visibility'
    domain: 'tracking-visibility'
    description: 'Track which items are on screen: useIsVisible, arrow hooks, observer options, the async IntersectionObserver truth model'
    type: 'core'
    covers:
      - 'useIsVisible(itemId | first | last, defaultValue)'
      - 'useLeftArrowVisible/useRightArrowVisible'
      - 'options prop: ratio, rootMargin, threshold'
      - 'items.getVisible()/subscribe/unsubscribe'
      - 'menuVisible gating'
      - 'isItemVisible'
      - 'IOItem shape'
    tasks:
      - 'disable arrows at the row edges'
      - 'style or animate items based on visibility'
      - 'react to visibility changes (progress dots, lazy loading)'
    failure_modes:
      - mistake: 'reading isFirstItemVisible/isLastItemVisible expecting reactivity'
        mechanism: 'These context fields are frozen first-render snapshots (computed while the ItemsMap is still empty; the api memo never recomputes) — they stay false forever. The reactive paths are the hooks or items.getVisible() read inside callbacks.'
        wrong_pattern: |
          const { isFirstItemVisible, scrollPrev } = React.useContext(VisibilityContext);
          return <button disabled={isFirstItemVisible} onClick={() => scrollPrev()}>←</button>;
        correct_pattern: |
          const api = React.useContext<publicApiType>(VisibilityContext);
          const disabled = api.useLeftArrowVisible();
          return <button disabled={disabled} onClick={() => api.scrollPrev()}>←</button>;
        source: 'src/createApi.ts:91-92; CHANGELOG v6.0.0'
        priority: 'CRITICAL'
        status: 'active'
        skills: ['menu-visibility', 'menu-migration']
      - mistake: 'visibility logic assuming items are known before being seen'
        mechanism: 'Items must be observed on screen at least once before visibility data exists; a menu below the fold at load has no valid data (dead or wrong arrows) until scrolled into view.'
        wrong_pattern: |
          onInit={(api) => {
            if (!api.isItemVisible('item-9')) api.scrollToItem(api.getItemById('item-9'));
          }}
        correct_pattern: |
          // gate on the menu actually being on screen first
          onUpdate={(api) => {
            if (api.items.getVisible().length && !api.isItemVisible('item-9')) {
              api.scrollToItem(api.getItemById('item-9'));
            }
          }}
        source: 'https://github.com/asmyshlyaev177/react-horizontal-scrolling-menu/issues/286 (#289, #284)'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'arrow state flickering when the page scrolls vertically'
        mechanism: 'Items leave the viewport when the page scrolls past the menu, so naive visibility-driven arrows flicker. useLeftArrowVisible/useRightArrowVisible already gate on menuVisible; hand-rolled useIsVisible arrows need the useState latch updated only while the menu is on screen.'
        wrong_pattern: |
          const disabled = api.useIsVisible('first', true);
          // flickers as the page scrolls the menu out of the viewport
        correct_pattern: |
          const isFirst = api.useIsVisible('first', true);
          const someVisible = !!api.items.getVisible().length;
          const [disabled, setDisabled] = React.useState(isFirst);
          React.useEffect(() => {
            if (someVisible) setDisabled(isFirst);
          }, [someVisible, isFirst]);
        source: 'https://github.com/asmyshlyaev177/react-horizontal-scrolling-menu/issues/284 (#275, #147, #298); stories/Simple'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'items larger than the container never count as visible'
        mechanism: 'An item is visible when intersectionRatio >= options.ratio (default 0.9); an item bigger than the container can never reach that, so edge detection and arrows break. Edge case per maintainer — items should normally be smaller than the container; fix with options={{ ratio: 0.5 }}.'
        wrong_pattern: |
          <ScrollMenu>{/* 100vw-wide slides, default ratio 0.9 */}</ScrollMenu>
        correct_pattern: |
          <ScrollMenu options={{ ratio: 0.5 }}>{/* oversized items */}</ScrollMenu>
        source: 'https://github.com/asmyshlyaev177/react-horizontal-scrolling-menu/issues/287 (#279); src/settings.ts'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'passing options.root expecting a custom observer root'
        mechanism: 'The options prop type accepts IntersectionObserverInit, but root is always overridden with the internal scroll container — a custom root is silently ignored.'
        wrong_pattern: |
          <ScrollMenu options={{ root: document.querySelector('#viewport') }}>
        correct_pattern: |
          <ScrollMenu options={{ ratio: 0.5, rootMargin: '5px' }}>
        source: 'src/hooks/useIntersectionObserver.ts:42'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'items.subscribe without matching unsubscribe cleanup'
        mechanism: 'subscribe/unsubscribe require the same callback instance; subscribing in an effect without cleanup (or unsubscribing a fresh closure) leaks subscribers across renders.'
        wrong_pattern: |
          React.useEffect(() => {
            api.items.subscribe('item5', (item) => setVisible(!!item?.visible));
          }, []);
        correct_pattern: |
          React.useEffect(() => {
            const cb = (item) => setVisible(!!item?.visible);
            api.items.subscribe('item5', cb);
            return () => api.items.unsubscribe(cb);
          }, []);
        source: 'README.md items class instance; src/ItemsMap/ItemsMap.ts'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'imperative scrolling'
    slug: 'menu-scrolling'
    domain: 'controlling-scroll'
    description: 'Scroll programmatically: scrollToItem/scrollNext/scrollPrev, apiRef control from outside, dynamic items, paging with slidingWindow/getItemsPos'
    type: 'core'
    covers:
      - 'scrollToItem(target, behavior, inline, block, ScrollOptions)'
      - 'scrollNext/scrollPrev'
      - 'apiRef'
      - 'getItemById/getItemByIndex/getItemElementById/getItemElementByIndex'
      - 'getNextElement/getPrevElement'
      - 'slidingWindow'
      - 'getItemsPos'
      - 'items ItemsMap methods'
    tasks:
      - 'scroll to a specific item (on mount, on selection)'
      - 'control the menu from outside via apiRef'
      - 'scroll a full page of items / center a group'
      - 'add items dynamically and scroll to them'
    reference_candidates:
      - topic: 'publicApiType member reference'
        reason: '25+ members across methods, hooks, snapshots and refs; agents need exact signatures'
    failure_modes:
      - mistake: 'passing an itemId string to scrollToItem'
        mechanism: 'The JSDoc claims a string id works, but a bare string is a silent no-op (no .entry, no .scrollIntoView) — pass getItemById(id) (blessed default) or getItemElementById(id) (advanced, stale-proof).'
        wrong_pattern: |
          api.scrollToItem('item-3', 'smooth', 'center');
        correct_pattern: |
          api.scrollToItem(api.getItemById('item-3'), 'smooth', 'center');
        source: 'src/createApi.ts:307-313 vs src/helpers.tsx:59-64; https://github.com/asmyshlyaev177/react-horizontal-scrolling-menu/issues/157'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'reading data values from apiRef'
        mechanism: 'apiRef is a mutable object React cannot re-render on; data values (items snapshots, visibility booleans) go stale — use it only to fire functions.'
        wrong_pattern: |
          const visible = apiRef.current.isLastItemVisible; // stale
        correct_pattern: |
          apiRef.current.scrollToItem(apiRef.current.getItemById('item-3'));
        source: 'README.md apiRef; https://github.com/asmyshlyaev177/react-horizontal-scrolling-menu/issues/167'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'getItemById right after adding an item returns undefined'
        mechanism: 'The ItemsMap lags children by one render; immediately after appending an item the map does not know it yet. Use getItemElementById/getItemElementByIndex (they query the DOM by data-key/data-index) for this advanced case.'
        wrong_pattern: |
          setItems([...items, newItem]);
          apiRef.current.scrollToItem(apiRef.current.getItemById(newItem.id)); // undefined
        correct_pattern: |
          // after the state update commits (effect/callback):
          apiRef.current.scrollToItem(
            apiRef.current.getItemElementById(newItem.id),
          );
        source: 'https://github.com/asmyshlyaev177/react-horizontal-scrolling-menu/issues/167; discussion #295; stories/AddItemAndScrollToIt'
        priority: 'HIGH'
        status: 'active'
        skills: ['menu-scrolling', 'menu-recipes']
      - mistake: 'scroll methods drag the whole page to the menu'
        mechanism: 'Scrolling is scrollIntoView-based, so calling scroll methods while the menu is off screen scrolls ancestors too (page jumps vertically/horizontally). Gate programmatic scrolling on the menu being on screen.'
        wrong_pattern: |
          setInterval(() => apiRef.current.scrollNext(), 3000); // page keeps jumping to the menu
        correct_pattern: |
          // only scroll while the menu itself is on screen
          if (apiRef.current.menuVisible.current) apiRef.current.scrollNext();
        source: 'https://github.com/asmyshlyaev177/react-horizontal-scrolling-menu/issues/276 (#277, #174, #230)'
        priority: 'HIGH'
        status: 'active'
        skills: ['menu-scrolling', 'menu-recipes']
      - mistake: 'numeric itemIds compared as numbers'
        mechanism: 'itemId is String()-coerced everywhere; getItemById(5) looks up "5" — mixing number and string ids causes missed lookups.'
        wrong_pattern: |
          <Card itemId={idx} />  /* later: */  api.getItemById(idx + 1)
        correct_pattern: |
          <Card itemId={String(idx)} />  /* later: */  api.getItemById(String(idx + 1))
        source: 'CHANGELOG v3.1.1 (#207); src/helpers.tsx:102'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'calling apiRef.current methods before mount'
        mechanism: 'apiRef is populated in a useEffect after mount; before that current is an empty object and method calls are undefined-function errors — guard with optional chaining or call from effects/handlers.'
        wrong_pattern: |
          const apiRef = React.useRef<publicApiType>(null);
          apiRef.current.scrollNext(); // during render — crash/no-op
        correct_pattern: |
          React.useEffect(() => { apiRef.current?.scrollNext(); }, [dep]);
        source: 'src/index.tsx:148,281-287'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'reimplementing page math instead of slidingWindow/getItemsPos'
        mechanism: 'Page-at-a-time and centering math is shipped: slidingWindow(allItems, visibleItems).prev()/.next() plus getItemsPos(group) — hand-rolled index math misses RTL and edge handling.'
        wrong_pattern: |
          const next = allItems[visibleIdx + perPage]; // hand-rolled paging
        correct_pattern: |
          const visible = api.items.getVisible().map(([id]) => id);
          const next = slidingWindow(api.items.toItems(), visible).next();
          api.scrollToItem(api.getItemById(getItemsPos(next).center), 'smooth', 'center');
        source: 'README.md Other helpers; stories/OneItemScroll'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'pointer interactions'
    slug: 'menu-interactions'
    domain: 'handling-input'
    description: 'Wire mouse drag, wheel and touch: the two callback shapes, DragDealer pattern, body-scroll locking, mobile swipe'
    type: 'core'
    covers:
      - 'onWheel/onScroll plain callbacks'
      - 'onMouseDown/onMouseUp/onMouseMove/onMouseLeave handler factories'
      - 'onTouchStart/onTouchMove/onTouchEnd handler factories'
      - 'mouse drag (DragDealer + dragging guard)'
      - 'preventing body scroll'
    tasks:
      - 'add drag-to-scroll with the mouse'
      - 'scroll one page per wheel tick'
      - 'stop the page from scrolling while over the menu'
      - 'desktop swipe'
    failure_modes:
      - mistake: 'passing a plain handler where a factory is expected'
        mechanism: 'onWheel/onScroll are plain (api, event) => void, but ALL mouse/touch props are factories (api) => (event) => void — a plain handler receives the api object as its "event" and silently does nothing useful.'
        wrong_pattern: |
          <ScrollMenu onMouseMove={(ev) => drag(ev)}>
        correct_pattern: |
          <ScrollMenu onMouseMove={(api) => (ev) => drag(ev)}>
        source: 'README.md props table note; src/index.tsx:322-328'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'drag-to-scroll fires item clicks on release'
        mechanism: 'After a drag ends, the click event still fires on the item under the cursor; guard click handlers with a dragging flag cleared one animation frame after mouseup (the DragDealer pattern).'
        wrong_pattern: |
          <Card onClick={() => select(id)} />  /* fires after every drag */
        correct_pattern: |
          <Card onClick={() => { if (!dragState.dragging) select(id); }} />
          // dragState.dragging cleared in requestAnimationFrame after mouseUp
        source: 'stories/MouseDrag (DragDealer class)'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'drag keeps scrolling after the cursor leaves the menu'
        mechanism: 'Without wiring onMouseLeave to end the drag, the container keeps following a mouse that is no longer over it.'
        wrong_pattern: |
          <ScrollMenu onMouseDown={...} onMouseUp={...} onMouseMove={...}>
        correct_pattern: |
          <ScrollMenu onMouseDown={...} onMouseUp={...} onMouseMove={...}
            onMouseLeave={(api) => () => dragStop()} >
        source: 'https://github.com/asmyshlyaev177/react-horizontal-scrolling-menu/issues/278 (v7.1.0)'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'preventDefault in onWheel/touchmove passive listeners'
        mechanism: 'React 17+ attaches wheel/touchmove as passive — ev.preventDefault() throws "Unable to preventDefault inside passive event listener"; body-scroll locking needs the non-passive workaround (native listener or CSS overscroll-behavior).'
        wrong_pattern: |
          onWheel={(api, ev) => { ev.preventDefault(); api.scrollNext(); }}
        correct_pattern: |
          onWheel={(api, ev) => {
            const isTouchpad = Math.abs(ev.deltaX) !== 0 || Math.abs(ev.deltaY) < 15;
            if (isTouchpad) return; // let native scroll handle it
            ev.deltaY < 0 ? api.scrollPrev() : api.scrollNext();
          }}
        source: 'stories/PreventBodyScroll; stories/Simple onWheel recipe'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'reading positions in onScroll expecting settled state'
        mechanism: 'onScroll fires before the scroll settles (documented in the props table) — position reads mid-animation are intermediate values; use onUpdate or poll after the transition.'
        wrong_pattern: |
          onScroll={(api) => savePosition(api.scrollContainer.current.scrollLeft)} // mid-animation
        correct_pattern: |
          onUpdate={(api) => savePosition(api.scrollContainer.current?.scrollLeft ?? 0)}
        source: 'README.md props table (onScroll fires before scroll settles); stories/SaveRestorePosition'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'transitions and RTL'
    slug: 'menu-transitions-rtl'
    domain: 'controlling-scroll'
    description: 'Animate scrolling and right-to-left layouts: the noPolyfill gate, transitionDuration/transitionBehavior, ScrollOptions overrides, RTL limits'
    type: 'core'
    covers:
      - 'noPolyfill (default true)'
      - 'transitionDuration (default 500, gated)'
      - 'transitionBehavior: smooth | auto | custom function (gated)'
      - 'ScrollOptions per-call override { duration, boundary }'
      - 'RTL prop'
    tasks:
      - 'slow down / customize the scroll animation'
      - 'custom easing function'
      - 'right-to-left menu'
    failure_modes:
      - mistake: 'transitionDuration/transitionBehavior with default noPolyfill'
        mechanism: 'noPolyfill defaults to true (native scrollIntoView) since v8.0.0; duration, boundary and custom-function behavior are silently discarded unless noPolyfill={false} pulls in the smooth-scroll polyfill.'
        wrong_pattern: |
          <ScrollMenu transitionDuration={1200}> // no effect — silently ignored
        correct_pattern: |
          <ScrollMenu noPolyfill={false} transitionDuration={1200}>
        source: 'src/helpers.tsx:72-77; src/index.tsx:183; CHANGELOG v8.0.0'
        priority: 'CRITICAL'
        status: 'active'
        skills: ['menu-transitions-rtl', 'menu-migration']
      - mistake: 'custom transitionBehavior function without noPolyfill={false}'
        mechanism: 'A function behavior is cast to a native ScrollBehavior string when noPolyfill is true — the browser ignores or rejects it; custom easing only works through the polyfill.'
        wrong_pattern: |
          <ScrollMenu transitionBehavior={(instructions) => customEase(instructions)}>
        correct_pattern: |
          <ScrollMenu noPolyfill={false}
            transitionBehavior={(instructions) => customEase(instructions)}>
        source: 'src/helpers.tsx:67; stories/CustomTransition'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'combining transition props with RTL'
        mechanism: 'The polyfill has RTL bugs (page-level horizontal scrolling); transitions and the RTL prop are documented as not combining — RTL menus should keep the noPolyfill default.'
        wrong_pattern: |
          <ScrollMenu RTL noPolyfill={false} transitionDuration={800}>
        correct_pattern: |
          <ScrollMenu RTL> // native scrolling; no transition props
        source: 'README.md Transitions and animation; https://github.com/asmyshlyaev177/react-horizontal-scrolling-menu/issues/230 (#241, #216)'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'required behavior field in ScrollOptions treated as effective'
        mechanism: 'The scrollToItemOptions type requires behavior but the positional argument always overrides it — only duration/boundary in the options object take effect (polyfill mode only).'
        wrong_pattern: |
          api.scrollToItem(el, undefined, 'center', 'nearest', { behavior: 'smooth' });
        correct_pattern: |
          api.scrollToItem(el, 'smooth', 'center', 'nearest', { duration: 800 });
        source: 'src/types.ts:55-59 vs src/helpers.tsx:66-77'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'testing and SSR'
    slug: 'menu-testing-ssr'
    domain: 'integrating-and-testing'
    description: 'Server rendering and testing: use client, hydration first-paint, ESM in Jest, IntersectionObserver mocks, async assertions'
    type: 'core'
    covers:
      - "'use client' requirement (React Server Components)"
      - 'useIsVisible defaultValue as SSR paint state'
      - 'transpilePackages for older Next.js'
      - 'Jest moduleNameMapper to dist/index.cjs'
      - 'IntersectionObserver mock in jsdom'
      - 'async visibility in tests (poll, never assert synchronously)'
    tasks:
      - 'use the menu in Next.js App Router / TanStack Start'
      - 'fix "Cannot use import statement outside a module" in Jest'
      - 'test menu behavior'
    failure_modes:
      - mistake: 'importing ScrollMenu in a React Server Component'
        mechanism: 'The library uses createContext, hooks and IntersectionObserver — it is client-only; without "use client" Next.js throws createContext is not a function.'
        wrong_pattern: |
          // app/page.tsx (server component)
          import { ScrollMenu } from 'react-horizontal-scrolling-menu';
        correct_pattern: |
          'use client';
          import { ScrollMenu } from 'react-horizontal-scrolling-menu';
        source: 'https://github.com/asmyshlyaev177/react-horizontal-scrolling-menu/issues/280; example-nextjs/app/page.tsx'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'wrong useIsVisible defaultValue causes hydration flicker'
        mechanism: 'defaultValue is the server-rendered/first-paint state; the canonical arrows use ("first", true) / ("last", false) so SSR matches a row at its start — wrong defaults flip arrow state after hydration. SSR issues are a maintainer-flagged confusion area.'
        wrong_pattern: |
          const disabled = api.useIsVisible('first'); // SSR paints enabled, flips on hydration
        correct_pattern: |
          const disabled = api.useIsVisible('first', true);
        source: 'README.md SSR; maintainer interview'
        priority: 'HIGH'
        status: 'active'
        skills: ['menu-testing-ssr', 'menu-visibility']
      - mistake: 'Jest chokes on the ESM package'
        mechanism: 'The package is type:module since v5; Jest without ESM support fails with "Cannot use import statement outside a module" — map the import to the shipped CJS build and mock IntersectionObserver in jsdom.'
        wrong_pattern: |
          // jest.config.js with no mapping — import statement error
        correct_pattern: |
          moduleNameMapper: {
            '^react-horizontal-scrolling-menu$':
              'react-horizontal-scrolling-menu/dist/index.cjs',
          },
        source: 'https://github.com/asmyshlyaev177/react-horizontal-scrolling-menu/issues/240'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'asserting visibility synchronously after an action'
        mechanism: 'Scrolling is animated and visibility is IntersectionObserver-driven — nothing about the menu is true the moment a click returns; assertions must poll (waitFor/expect.poll). Maintainer stance: test in a real browser (Playwright/Cypress), not against Jest mocks.'
        wrong_pattern: |
          fireEvent.click(nextArrow);
          expect(screen.getByTestId('card-3')).toBeVisible(); // IO has not fired
        correct_pattern: |
          await user.click(nextArrow);
          await waitFor(() => expect(getVisibleIds()).toEqual(['3', '4', '5']));
        source: 'stories/test.tsx; e2e/scrolling-menu.spec.ts; issue #240 discussion'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'old Next.js pages router fails to parse the ESM package'
        mechanism: 'Older Next.js setups need the package listed in transpilePackages to consume the ESM build.'
        wrong_pattern: |
          // next.config.js without transpilePackages on old Next — import error
        correct_pattern: |
          module.exports = { transpilePackages: ['react-horizontal-scrolling-menu'] };
        source: 'README.md Next.js note; https://github.com/asmyshlyaev177/react-horizontal-scrolling-menu/issues/240'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'recipes'
    slug: 'menu-recipes'
    domain: 'composing-features'
    description: 'Userland features composed on the public API: autoplay, infinite loop, center-on-click, save/restore position, load-more, one-item-per-scroll — recipes, not props'
    type: 'core'
    covers:
      - 'autoplay (interval gated on menu visibility)'
      - 'infinite loop (clone-and-teleport)'
      - 'center on click'
      - 'save/restore scroll position'
      - 'load more / dynamic add with loader item'
      - 'one item per scroll'
      - 'hide arrows / arrows in footer'
      - 'multiple menus and tab switching'
      - 'Storybook story map'
    tasks:
      - 'add autoplay to the menu'
      - 'make the menu loop infinitely'
      - 'center the clicked item'
      - 'restore scroll position after navigation'
      - 'load more items when the end comes into view'
    subsystems: []
    failure_modes:
      - mistake: 'hallucinating autoplay/loop/snap props'
        mechanism: 'Autoplay and infinite loop are deliberately not props — they are ~60-line recipes on the public API (Storybook: Autoplay, InfiniteLoop); an agent inventing autoplay={true} generates dead code. Same for snap physics — out of scope by design.'
        wrong_pattern: |
          <ScrollMenu autoplay autoplayInterval={3000} loop>
        correct_pattern: |
          // autoplay = setInterval calling api.scrollNext(), gated on menu visibility
          // loop = clone head/tail items + teleport scrollLeft at the seams
          // (see Autoplay and InfiniteLoop stories for the full recipes)
        source: 'README.md "What it does — and doesn''t"; stories/Autoplay, stories/InfiniteLoop'
        priority: 'CRITICAL'
        status: 'active'
      - mistake: 'autoplay interval scrolls the page to the menu'
        mechanism: 'scrollNext on an off-screen menu drags the page (scrollIntoView reaches ancestors); gate the interval on the menu being visible.'
        wrong_pattern: |
          setInterval(() => apiRef.current?.scrollNext(), 3000);
        correct_pattern: |
          setInterval(() => {
            if (apiRef.current?.menuVisible.current) apiRef.current.scrollNext();
          }, 3000);
        source: 'https://github.com/asmyshlyaev177/react-horizontal-scrolling-menu/issues/276; stories/Autoplay'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'promising a seamless infinite loop without clones'
        mechanism: 'A true seamless loop needs cloned head/tail items and scrollLeft teleports at the seams; without clones the only option is scroll-back-to-first (visible jump).'
        wrong_pattern: |
          onUpdate={(api) => { if (api.useIsVisible('last')) api.scrollToItem(api.getItemById('first')); }}
        correct_pattern: |
          // render [tailClones, ...items, headClones]; on scroll into a clone zone,
          // set scrollContainer.current.scrollLeft to the mirrored real position
          // (see the InfiniteLoop story — clone zones are pixel-identical)
        source: 'https://github.com/asmyshlyaev177/react-horizontal-scrolling-menu/issues/213; stories/InfiniteLoop; stories/loopTestUtils.ts'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'tab-switching reuses one menu with stale position/state'
        mechanism: 'When one ScrollMenu renders different item sets per tab, position and visibility carry over; either reset via apiRef in an effect or force a remount with key={selectedTab}.'
        wrong_pattern: |
          <ScrollMenu>{tabs[selected].items.map(...)}</ScrollMenu>
        correct_pattern: |
          <ScrollMenu key={selected}>{tabs[selected].items.map(...)}</ScrollMenu>
        source: 'discussion #294; https://github.com/asmyshlyaev177/react-horizontal-scrolling-menu/issues/204'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'load-more without a dedicated loader item'
        mechanism: 'The blessed pattern gives the loader its own itemId as the last child and triggers fetching from onUpdate when the last item becomes visible — hand-rolled scroll-position math breaks with dynamic widths.'
        wrong_pattern: |
          onScroll={(api, ev) => { if (ev.target.scrollLeft > threshold) fetchMore(); }}
        correct_pattern: |
          onUpdate={(api) => {
            if (api.items.last()?.visible && !loading) fetchMore();
          }}
        source: 'stories/AddItems; discussion #297'
        priority: 'MEDIUM'
        status: 'active'

  - name: 'migration from older versions'
    slug: 'menu-migration'
    domain: 'staying-current'
    description: 'Detect and upgrade pre-v8 patterns: v6 visibility API removals, separators, Arrows prop, CJS, noPolyfill flip — the API agents trained on older data still generate'
    type: 'lifecycle'
    covers:
      - 'version-to-pattern cheat sheet (era detection)'
      - 'v6: visibleElements/isFirstItemVisible/isLastItemVisible/initComplete removal'
      - 'v7: Separator/getPrevItem/getNextItem removal'
      - 'v8: noPolyfill default flip'
      - 'v5: ESM-only'
      - 'v4: separate styles.css'
      - 'v3: Arrows prop removal'
      - '8.1.0 changelog replay artifact'
      - '>=8.2.2 for TS moduleResolution node16/bundler'
    tasks:
      - 'upgrade an app from v5/v6/v7 to v8'
      - 'fix AI-generated code that uses removed APIs'
      - 'recognize which library era existing code targets'
    failure_modes:
      - mistake: 'destructuring the removed v5-era visibility API from context'
        mechanism: 'visibleElements, initComplete and reactive isFirstItemVisible/isLastItemVisible were removed in v6 (Observer rewrite); nearly every pre-2024 tutorial and StackOverflow answer uses them — in v8 they are undefined or frozen snapshots.'
        wrong_pattern: |
          const { isFirstItemVisible, visibleElements, initComplete } =
            React.useContext(VisibilityContext);
        correct_pattern: |
          const api = React.useContext<publicApiType>(VisibilityContext);
          const disabled = api.useLeftArrowVisible();
          const visibleIds = api.items.getVisible().map(([id]) => id);
        source: 'CHANGELOG v6.0.0 (#270); issue #282'
        priority: 'CRITICAL'
        status: 'active'
        skills: ['menu-migration', 'menu-visibility']
      - mistake: 'using Separator items or getPrevItem/getNextItem'
        mechanism: 'v7 removed separator elements and getPrevItem/getNextItem; spacing is CSS, prev/next math is slidingWindow/getItemsPos or items.prev()/next().'
        wrong_pattern: |
          const nextItem = api.getNextItem();
        correct_pattern: |
          const nextItem = api.items.next(api.items.getVisible().at(-1)?.[1]);
        source: 'CHANGELOG v7.0.0 (#274)'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'assuming smooth animated scroll is polyfilled by default'
        mechanism: 'v8.0.0 flipped noPolyfill to true — code relying on default duration/easing behaves differently after upgrade; pass noPolyfill={false} to restore v5–v7 behavior.'
        wrong_pattern: |
          <ScrollMenu transitionDuration={800}> // worked in v7, ignored in v8
        correct_pattern: |
          <ScrollMenu noPolyfill={false} transitionDuration={800}>
        source: 'CHANGELOG v8.0.0'
        priority: 'HIGH'
        status: 'active'
      - mistake: 'trusting the 8.1.0 BREAKING CHANGES block as new breakage'
        mechanism: 'The 8.1.0 changelog entry replays every historical breaking change (a squash artifact) — an agent reading it misattributes v4–v8 breaks to 8.1.0; genuinely new in 8.1.0 were only the useLeftArrowVisible/useRightArrowVisible hooks.'
        wrong_pattern: |
          // "8.1.0 removed visibleElements, so pin 8.0.x" — wrong; removed in 6.0.0
        correct_pattern: |
          // treat the 8.1.0 block as history; migrate straight to >=8.2.2
        source: 'CHANGELOG.md:29-100'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'using the v2-era Arrows wrapper prop'
        mechanism: 'The Arrows prop was removed in v3; arrows are LeftArrow/RightArrow slots, extra content goes in Header/Footer.'
        wrong_pattern: |
          <ScrollMenu Arrows={MyArrows}>
        correct_pattern: |
          <ScrollMenu LeftArrow={LeftArrow} RightArrow={RightArrow} Header={Title}>
        source: 'CHANGELOG v3.0.0 (#197)'
        priority: 'MEDIUM'
        status: 'active'
      - mistake: 'TypeScript cannot find types on 8.2.0/8.2.1'
        mechanism: 'The types condition order in the exports map was wrong until 8.2.2 — with moduleResolution node16/bundler TS fails to resolve types; pin >=8.2.2.'
        wrong_pattern: |
          "react-horizontal-scrolling-menu": "8.2.0"
        correct_pattern: |
          "react-horizontal-scrolling-menu": "^8.2.3"
        source: 'CHANGELOG 8.2.2'
        priority: 'MEDIUM'
        status: 'active'

tensions:
  - name: 'trivial quick start vs total silence on misuse'
    skills: ['menu-setup', 'menu-visibility', 'menu-scrolling']
    description: 'The happy path is a few lines, but the library contains zero throws or warnings — every contract violation (missing CSS, missing/duplicate itemId, string to scrollToItem) fails silently.'
    implication: 'An agent that ships the quick start without self-checking the contracts produces a menu that renders but does not work, with no error to debug from.'
  - name: 'imperative convenience vs reactive truth'
    skills: ['menu-scrolling', 'menu-visibility']
    description: 'The api object mixes live methods, reactive hooks, frozen snapshots (isFirstItemVisible) and mutable stores (items, apiRef) — imperative reads are convenient but stale; hooks are correct but bound by rules of hooks.'
    implication: 'Agents optimizing for imperative code read snapshot fields and render stale UI; agents optimizing for reactivity call context hooks outside components rendered under ScrollMenu.'
  - name: 'native scroll correctness vs animation control'
    skills: ['menu-transitions-rtl', 'menu-scrolling']
    description: "noPolyfill=true (default) avoids the polyfill's elusive bugs but makes transition props no-ops; enabling the polyfill restores animation control and re-imports edge bugs (RTL, page scrolling)."
    implication: 'Agents adding transitionDuration for polish silently get nothing; agents flipping noPolyfill for animation break RTL menus.'
  - name: 'SSR first paint vs async browser truth'
    skills: ['menu-testing-ssr', 'menu-visibility']
    description: 'The server paints defaultValue guesses; real visibility exists only after IntersectionObserver fires client-side — until then nothing about the menu is true.'
    implication: 'Agents read visibility at mount (wrong on both server and first client frame) or assert it synchronously in tests instead of polling.'

