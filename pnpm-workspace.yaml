packages:
  - example-nextjs
  - example-tanstack
  - website

# Replaces a wireit `install-deps` script that cached node_modules as `output`.
# Was off because auto-install failed on unapproved builds; allowBuilds covers them.
verifyDepsBeforeRun: install
allowBuilds:
  '@swc/core': true
  core-js: true
  esbuild: true
  unrs-resolver: true
  workerd: true
onlyBuiltDependencies:
  - core-js
  - '@swc/core'
  - esbuild
  - unrs-resolver
  - workerd
